name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy
        env:
          DATABASE_URL: sqlite://

      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Tests (against PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pytest --cov --cov-report=term --cov-report=xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

      # Regression gates that need no database or LLM: the hallucination
      # detector's recall / false-positive bar, and hybrid retrieval never
      # completing fewer cases than dense retrieval (real local models).
      - name: Offline evaluations
        env:
          DATABASE_URL: sqlite://
        run: |
          python -m eval.hallucination --out "$RUNNER_TEMP/evaluation-hallucination.md"
          python -m eval.retrieval --out "$RUNNER_TEMP/evaluation-retrieval.md"

  frontend:
    name: Frontend (lint, tests, build) on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported release (package.json "engines") and the one
        # in frontend/Dockerfile.
        node: ["22.22", "26"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  security:
    name: Security scans (secrets, dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history for committed secrets

      - name: Secrets in the git history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: pipx run pip-audit==2.10.0 -r backend/requirements.txt --no-deps --disable-pip --progress-spinner off

      - name: npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    name: Docker images build and scan
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: rag-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          load: true
          tags: rag-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # Fails on critical vulnerabilities that already have a fixed release.
      - name: Scan the images
        run: |
          for image in rag-backend:ci rag-frontend:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              anchore/grype:v0.122.1 "$image" --only-fixed --fail-on critical
          done
